{% extends "base.html" %}
{% block title %}Planets - BTK{% endblock %}
{% block content %}
<h1>Planets</h1>
{% if round %}
    <p class="subtitle">Round {{ round.number }}{% if round.name %} &mdash; {{ round.name }}{% endif %}</p>
{% endif %}
<form class="search-form" method="get" action="/web/planets" id="planets-form">
    <span class="prompt">&gt;</span>
    <input type="text" name="q" value="{{ q }}" placeholder="x:y:z or x y z for a planet, x:y or x y for a galaxy, or a planet/ruler{% if user %}/nick{% endif %} name" autocomplete="off" id="planets-query">
    <button type="submit">Query</button>
</form>
<div id="planets-results">
{% include "_planets_results.html" %}
</div>
<script>
    // Live filtering: re-fetch just the results fragment as you type instead
    // of a full page reload per keystroke -- the plain <form> above still
    // works untouched (same GET, same URL) if JS is unavailable.
    (function () {
        var input = document.getElementById("planets-query");
        var form = document.getElementById("planets-form");
        var results = document.getElementById("planets-results");
        var timer = null;

        function load(q) {
            var url = "/web/planets?q=" + encodeURIComponent(q);
            fetch(url, {headers: {"X-BTK-Partial": "1"}})
                .then(function (r) { return r.text(); })
                .then(function (html) {
                    results.innerHTML = html;
                    history.replaceState(null, "", url);
                });
        }

        input.addEventListener("input", function () {
            clearTimeout(timer);
            timer = setTimeout(function () { load(input.value); }, 300);
        });

        form.addEventListener("submit", function (e) {
            e.preventDefault();
            clearTimeout(timer);
            load(input.value);
        });
    })();
</script>
{% endblock %}
