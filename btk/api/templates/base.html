<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}BTK{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <!-- Applied before first paint so the theme never flashes between pages. -->
    <script>
        (function () {
            var stored = localStorage.getItem("theme");
            var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
            document.documentElement.classList.toggle("dark", dark);
        })();
    </script>
</head>
<body>
    <header class="mission-bar">
        <div class="mission-bar-inner">
            <a class="wordmark" href="/">BTK</a>
            <form class="header-search" method="get" action="/web/planets">
                <span class="prompt">&gt;</span>
                <input id="site-search" type="text" name="q" placeholder="planet, ruler{% if user %}, nick{% endif %}, x:y:z or x:y&hellip;" autocomplete="off">
                <span class="tag kbd-hint" aria-hidden="true">/</span>
            </form>
            <div class="nav-controls">
                {% if user %}
                <span class="account">
                    {{ user.username }}
                    <form action="/logout" method="post">
                        <button type="submit" class="link-button">Log out</button>
                    </form>
                </span>
                {% else %}
                <a class="nav-link{% if request.url.path == '/login' %} active{% endif %}" href="/login{% if request.url.path != '/' %}?next={{ request.url.path }}{% endif %}">Log in</a>
                {% endif %}
                <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to light mode">
                    <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                    <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
            </div>
        </div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <script>
        // "/" jumps to the search box from anywhere on the site -- the
        // header search is the site's primary navigation now, so this is
        // the single highest-value shortcut. Ignored while already typing
        // in a field (so it doesn't hijack a literal "/" in a query) or
        // with a modifier held (so it doesn't fight browser/OS shortcuts).
        (function () {
            var input = document.getElementById("site-search");
            var hint = document.querySelector(".kbd-hint");
            document.addEventListener("keydown", function (e) {
                if (e.key !== "/" || e.metaKey || e.ctrlKey || e.altKey) return;
                var tag = document.activeElement ? document.activeElement.tagName : "";
                if (tag === "INPUT" || tag === "TEXTAREA") return;
                e.preventDefault();
                input.focus();
                input.select();
            });
            if (hint) {
                input.addEventListener("focus", function () { hint.style.display = "none"; });
                input.addEventListener("blur", function () { hint.style.display = ""; });
            }
        })();
        (function () {
            var btn = document.getElementById("theme-toggle");
            var root = document.documentElement;
            function sync() {
                var dark = root.classList.contains("dark");
                btn.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
            }
            btn.addEventListener("click", function () {
                var dark = root.classList.toggle("dark");
                localStorage.setItem("theme", dark ? "dark" : "light");
                sync();
            });
            sync();
        })();
    </script>
</body>
</html>
